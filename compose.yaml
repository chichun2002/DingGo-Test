services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8765:80"
    volumes:
      - .:/var/www/html
    environment:
      DEBUG: "false"
      DATABASE_URL: mysql://cake:secret@db/cake
      DATABASE_TEST_URL: mysql://cake:secret@db/cake_test
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cake
      MYSQL_USER: cake
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    # TODO(human): add a healthcheck so Compose knows when MySQL is actually
    # ready, then change app's depends_on to wait for "service_healthy"

volumes:
  db_data:
